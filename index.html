<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 구글 폰트 및 프리텐다드 CDN -->

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    /* 디자인 시스템 변수 및 기본 설정 */
    :root {
      --bg: #F7F7FB;
      --text: #14142B;
      --sub: #6B6B80;
      --line: rgba(20,20,43,.08);
      --brand: linear-gradient(120deg, #6E8BFF, #A77BFF 40%, #FF8AC8 70%, #FFB37A);
      --brand-text: linear-gradient(120deg, #4F6BFF, #8B5CF6 40%, #EC4899 70%, #FF7A45);
      --glass: rgba(255,255,255,.55);
      --glass-border: 1px solid rgba(255,255,255,.7);
      --glass-shadow: 0 30px 80px -30px rgba(76,70,160,.25);
      --easing: cubic-bezier(.2,1.3,.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      word-break: keep-all;
      overflow-x: hidden;
      position: relative;
    }

    /* 아주 옅은 노이즈 그레인 배경 오버레이 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 공통 유리 스타일 */
    .glass-box {
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 28px;
    }

    /* 그라데이션 타이포 및 강조 */
    .grad-text {
      background: var(--brand-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .serif-it {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    /* 1. 상단 고정 내비게이션 */
    .nav-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      translate: -50% 0;
      width: min(1080px, calc(100% - 24px));
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: var(--glass-border);
      box-shadow: 0 10px 30px -10px rgba(76,70,160,.15);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      text-decoration: none;
      color: var(--text);
    }
